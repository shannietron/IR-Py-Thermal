[project]
name = "ir-py-thermal"
version = "0.1.0"
description = "Python thermal camera library for Xtherm / HT-301 / InfiRay cameras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10,<5",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pyserial>=3.5",
    # macOS: AVFoundation capture path (see macos_capture.py)
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=10; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ISC001",
    "COM812", # trailing comma missing
    "D203", # one-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "T201", # print-found
    "TD002", # issue author missing
    "TD003", # issue link missing
    ]
